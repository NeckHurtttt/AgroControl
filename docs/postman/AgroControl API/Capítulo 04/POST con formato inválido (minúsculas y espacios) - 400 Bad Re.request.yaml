$kind: http-request
name: POST con formato inválido (minúsculas y espacios) -> 400 Bad Request
url: "{{baseUrl}}/api/roles"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "jefe de campo"
    }
order: 3000
